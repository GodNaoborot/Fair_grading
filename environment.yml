# Окружение для conda. Альтернатива requirements.txt: ставит те же пакеты
# из conda-forge, не смешивая их с pip.
#
#     conda env create -f environment.yml
#     conda activate fair-grading
#
# Смешивать с pip в одном окружении не следует; если пакет всё же ставится
# через pip, делать это нужно последним и с оглядкой на numpy — numba
# требует версию ниже 2.5.
name: fair-grading

channels:
  - conda-forge

dependencies:
  - python>=3.11
  # Сэмплирование и вывод
  - pymc>=5.20
  - arviz>=0.18
  - pytensor>=2.20
  - nutpie>=0.13
  # Численные библиотеки. Верхняя граница numpy обязательна: numba,
  # приходящая с nutpie и pytensor, новее не поддерживает.
  - numpy>=2.0,<2.5
  - pandas>=2.0
  - scipy>=1.13
  # Обязателен на Windows. numba подхватывает MKL из окружения, а её
  # mkl_intel_thread требует настоящий libiomp5md.dll; без этого пакета
  # сэмплирование падает с `Windows Error 0xc06d007f` ещё до первого шага.
  - intel-openmp
  # Графики
  - matplotlib-base>=3.8
  # Чтение и запись трасс в netCDF
  - h5netcdf>=1.0
  - h5py>=3.0
  # Ноутбуки
  - jupyter
  - ipykernel
  # Тесты
  - pytest>=8.0
  # Парсер исходной выгрузки
  - openpyxl
  - xlrd>=2.0
